<svg xmlns="http://www.w3.org/2000/svg" width="680" height="182" viewBox="0 0 680 182" role="img" aria-labelledby="quote-title quote-desc">
<title id="quote-title">Ever tried. Ever failed. No matter. Try again. Fail again. Fail better.</title>
<desc id="quote-desc">Samuel Beckett. Learn. Build. Evolve.</desc>
<defs><linearGradient id="accent"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<rect x="1" y="1" width="678" height="180" rx="14" fill="#0d1117" stroke="#30363d"/>
<path d="M280 1h120" stroke="url(#accent)" stroke-width="2"/>
<g text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">
<text x="340" y="53" fill="#e6edf3" font-size="22" font-style="italic">“Ever tried. Ever failed. No matter.</text>
<text x="340" y="85" fill="#e6edf3" font-size="22" font-style="italic">Try again. Fail again. Fail better.”</text>
<text x="340" y="116" fill="#919baa" font-size="14">Samuel Beckett</text>
<text x="340" y="153" fill="#a78bfa" font-family="Consolas,monospace" font-size="12" letter-spacing="3">LEARN · BUILD · EVOLVE</text>
</g></svg>
