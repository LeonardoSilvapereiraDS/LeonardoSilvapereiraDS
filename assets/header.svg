  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#30334c"/>
  <path d="M54 54H90M54 54V90M1146 306H1110M1146 306V270" fill="none" stroke="url(#accent)" stroke-width="2"/>
